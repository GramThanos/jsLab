<!DOCTYPE html>

<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jsLab · Multi-VM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" integrity="sha384-nWN3KqaaVcbEsCjLSV+2jMjh62Iny/+mN3srM8TZeM8N6aj7eDl5wwYggjAJ4/sJ" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css" integrity="sha384-n2n7twoohnW+d3myBKaUgl7DSiwidw6MkQy9oesGzkPpMjejKRR3XlnD+5yCdtBD" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.js" integrity="sha384-f/1U6Z9wM4D71a5eRXEZnyOTMOvjqxr2XLwh+Go1OvIl3L3tOcvUrzudnhbECwl4" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/lib/addon-fit.js" integrity="sha384-txoiwu4RR2GD3qySbaj+BbzibkLbSJRcfqGYMu6z1EqHil4A2dyBiBW5dlacG6OR" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.12.0/lib/addon-web-links.js" integrity="sha384-0IIwkXq0LAkIxEVKxlOxWbje2g/VT+5CzVTZiEukyiZ02pOl/O+M0fkpEKAYqto9" crossorigin="anonymous"></script>
<style>
  .vm-term { height: 380px; background: #0d1117; padding: 6px; }
  .vm-term .xterm { height: 100%; }
  #empty { max-width: 36rem; }
</style>
</head>
<body class="d-flex flex-column min-vh-100 bg-body">
<nav class="navbar bg-1 border-bottom px-3 gap-2 flex-wrap">
  <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html"><i class="bi bi-diagram-3"></i> jsLab · Multi-VM</a>
  <select id="distro" class="form-control form-control-sm w-auto" aria-label="Distro">
    <option value="">Loading distros…</option>
    <option value="custom">Custom config URL…</option>
  </select>
  <input id="cfg" class="form-control form-control-sm w-auto" size="40" placeholder="https://…/config.cfg" aria-label="Config URL" hidden>
  <select id="mode" class="form-control form-control-sm w-auto" aria-label="Where the VM runs" title="Where the VM runs">
    <option value="worker">worker thread</option>
    <option value="inline">main thread</option>
    <option value="isolated">isolated worker (sandboxed frame, no network)</option>
  </select>
  <div class="input-group input-group-sm w-auto" title="Guest memory">
    <span class="input-group-text"><i class="bi bi-memory"></i></span>
    <input id="mem" type="number" class="form-control" value="256" min="32" step="32" style="width: 5.5rem" aria-label="Memory in MB">
    <span class="input-group-text">MB</span>
  </div>
  <div class="btn-group" role="group" aria-label="Lab">
    <button id="add" class="btn btn-sm btn-icon btn-solid theme-primary" title="Add a VM" aria-label="Add a VM"><i class="bi bi-plus-lg"></i></button>
    <button id="stopall" class="btn btn-sm btn-icon btn-subtle theme-danger" title="Remove all VMs" aria-label="Remove all VMs"><i class="bi bi-trash3"></i></button>
  </div>
  <span id="lan" class="ms-auto badge badge-subtle theme-info font-monospace" title="The virtual LAN: subnet, then VMs and DHCP leases">10.0.2.0/24</span>
</nav>

<main class="flex-grow-1 container-fluid py-3">
  <div id="empty" class="mx-auto text-center fg-3 py-5">
    <i class="bi bi-hdd-network" style="font-size: 2.5rem"></i>
    <p class="mt-2">Every VM joins one virtual LAN (10.0.2.0/24, DHCP from 10.0.2.2).
      Add two or more with <i class="bi bi-plus-lg"></i>, bring each one's network up with
      <i class="bi bi-ethernet"></i>, then start the chat on each with <i class="bi bi-chat-dots"></i>.</p>
  </div>
  <div id="grid" class="row g-3"></div>
</main>
<footer id="status" class="px-3 py-1 border-top bg-1 text-sm fg-3">Ready.</footer>

<script type="module">
// Several VMs on one VirtualNetwork (lib/vm, lib/network), each console in
// xterm.js (terminal.js), the distro list from distros.js.
import { VMManager } from '../lib/vm/index.js';
import { createTerminal } from './terminal.js';
import { loadDistros } from './distros.js';
import { resolveEngine } from './engine.js';

const CHAT_URL = new URL('lan-chat.py', location.href);
const $ = (id) => document.getElementById(id);
const status = (text) => { $('status').textContent = text; };
const STATE_THEME = { starting: 'warning', running: 'success', paused: 'secondary', stopped: 'secondary', error: 'danger' };

const engine = await resolveEngine();   // ?engine=latest|<version>|<folder>
const ENGINE_NOTE = `Engine: ${engine.label}.`;
const mgr = new VMManager({ network: { subnet: '10.0.2.0/24' }, urls: engine.urls });
window.mgr = mgr;   // for console poking
let n = 0;

// Up the link, then ask the JS DHCP server for a lease (busybox udhcpc).
const NET_UP = 'ip link set eth0 up && udhcpc -i eth0 -q -n -t 5\n';

function updateLan() {
  const leases = mgr.network.getDHCPServer()?.getStats().leases ?? 0;
  $('lan').textContent = `10.0.2.0/24 · ${mgr.vms.size} VM${mgr.vms.size === 1 ? '' : 's'} · ${leases} lease${leases === 1 ? '' : 's'}`;
  $('empty').hidden = mgr.vms.size > 0;
}

function iconButton(icon, label, theme = 'secondary') {
  const b = document.createElement('button');
  b.className = `btn btn-sm btn-icon btn-subtle theme-${theme}`;
  b.title = label; b.setAttribute('aria-label', label);
  b.innerHTML = `<i class="bi bi-${icon}"></i>`;
  return b;
}

function card(id) {
  const col = document.createElement('div');
  col.className = 'col-12 lg:col-6';
  col.innerHTML = `
    <div class="card h-100">
      <div class="card-header d-flex flex-row align-items-center gap-2 flex-wrap text-start">
        <i class="bi bi-pc-display"></i>
        <span class="fw-semibold">${id}</span>
        <span class="badge theme-warning" data-state>starting</span>
        <span class="badge badge-subtle theme-secondary font-monospace" data-ip title="IPv4 address (click to copy)" role="button">no IP</span>
        <span class="text-xs fg-3 font-monospace" data-mac title="MAC address"></span>
        <div class="btn-toolbar gap-1 ms-auto" data-tools></div>
      </div>
      <div class="vm-term" data-term></div>
    </div>`;
  $('grid').appendChild(col);
  return col;
}

async function addVM() {
  const id = 'vm' + (++n);
  const choice = $('distro').value;
  const configUrl = choice === 'custom' ? $('cfg').value.trim() : choice;
  if (!configUrl) { status('Pick a distro, or enter a config URL.'); n--; return; }
  const mode = $('mode').value;
  const memoryMB = parseInt($('mem').value, 10) || 256;

  const col = card(id);
  const q = (sel) => col.querySelector(sel);
  let vm = null;
  const t = createTerminal(q('[data-term]'), { onData: (d) => vm?.sendInput(d) });
  const { cols, rows } = t.fit();

  try {
    vm = await mgr.create(id, { configUrl, mode, memoryMB, hasNetwork: true, cols, rows });
  } catch (e) { col.remove(); status(`create ${id} failed: ${e.message}`); return; }
  updateLan();

  // Console → xterm, unless a file transfer holds it back (installChat).
  let hold = null;
  const dec = new TextDecoder();
  vm.onConsole((b) => { if (hold) hold(b, dec.decode(b, { stream: true })); else t.write(b); });

  const stateEl = q('[data-state]'), ipEl = q('[data-ip]');
  q('[data-mac]').textContent = vm.mac;
  vm.onState((s) => {
    stateEl.textContent = s; stateEl.className = `badge theme-${STATE_THEME[s] || 'secondary'}`;
    pauseBtn.innerHTML = `<i class="bi bi-${s === 'paused' ? 'play-fill' : 'pause-fill'}"></i>`;
    pauseBtn.title = s === 'paused' ? 'Resume' : 'Pause';
  });
  vm.onAddress((ip) => {
    ipEl.textContent = ip;
    ipEl.className = 'badge badge-subtle theme-info font-monospace';
    status(`${id} has address ${ip}.`);
    updateLan();
  });
  ipEl.onclick = () => vm.ip && navigator.clipboard.writeText(vm.ip).then(() => status(`Copied ${vm.ip}.`), () => {});
  vm.onLog(({ level, text }) => { if (level === 'err') console.warn(`[${id}]`, text); });
  vm.onError((e) => status(`${id} error: ${e.message}`));

  const tools = q('[data-tools]');
  const netBtn = iconButton('ethernet', 'Network up: link up and get a DHCP lease');
  const chatBtn = iconButton('chat-dots', 'Install and start lan-chat.py (peer-to-peer chat)');
  const copyBtn = iconButton('copy', 'Copy selection (Ctrl+Shift+C)');
  const pasteBtn = iconButton('clipboard', 'Paste (Ctrl+Shift+V)');
  const pauseBtn = iconButton('pause-fill', 'Pause');
  const removeBtn = iconButton('x-lg', 'Stop and remove this VM', 'danger');
  tools.append(netBtn, chatBtn, copyBtn, pasteBtn, pauseBtn, removeBtn);

  // The images boot to a root shell with eth0 down and no DHCP client running.
  netBtn.onclick = () => { vm.sendInput(NET_UP); status(`${id}: requesting a DHCP lease…`); t.focus(); };
  chatBtn.onclick = () => installChat(vm, t, (fn) => { hold = fn; }).catch((e) => status(`${id}: ${e.message}`));
  copyBtn.onclick = () => t.copy().then((ok) => { if (!ok) status('Select some text in the console first.'); });
  pasteBtn.onclick = () => t.paste();
  pauseBtn.onclick = async () => {
    if (vm.state === 'paused') await vm.resume();
    else if (!(await vm.pause())) status(`${id}: this engine build can't pause (no vm_pause export).`);
  };
  removeBtn.onclick = async () => { await mgr.destroy(id); t.dispose(); col.remove(); updateLan(); status(`${id} removed.`); };

  status(`${id} starting (${mode === 'worker' ? 'worker thread' : 'main thread'})…`);
  try { await vm.start(); status(`${id} is booting: a shell in about 20 s, then press its network button.`); }
  catch (e) { status(`${id} start failed: ${e.message}`); }
  t.focus();
}

// Type lan-chat.py into the guest (it has no internet to download it), then
// run it. The console output is held back while the file goes in, so the
// script doesn't scroll by; a marker the shell prints says the file is written.
async function installChat(vm, t, setHold) {
  const script = await fetch(CHAT_URL).then((r) => { if (!r.ok) throw new Error(`lan-chat.py: HTTP ${r.status}`); return r.text(); });
  const marker = '__LANCHAT_OK';
  let seen = '';
  t.write('\r\n\x1b[2m[typing lan-chat.py into /root…]\x1b[0m');
  // Done once the marker AND the next shell prompt are out: busybox ash ends
  // its prompt with a cursor-position query (ESC[6n), and xterm's answer must
  // not arrive after python3 starts, or Python reads it as typed text. Held
  // back, the query is never answered, which ash doesn't mind.
  const done = new Promise((resolve) => {
    const timer = setTimeout(() => resolve(false), 180000);
    setHold((bytes, text) => {
      seen = (seen + text).slice(-300);
      const i = seen.indexOf(marker);
      if (i >= 0 && /\x1b\[6n|[#$] $/.test(seen.slice(i))) { clearTimeout(timer); resolve(true); }
    });
  });
  // A quoted heredoc writes the file verbatim; printf builds the marker so the
  // echoed command line itself doesn't contain it.
  vm.sendInput(`cat > /root/lan-chat.py <<'LANCHAT_EOF'\n${script.replace(/\n?$/, '\n')}LANCHAT_EOF\nprintf '%s_OK\\n' __LANCHAT\n`);
  const ok = await done;
  setHold(null);
  if (!ok) { t.write('\r\n\x1b[31m[no confirmation from the guest after 3 minutes]\x1b[0m\r\n'); return; }
  t.write(' \x1b[32mdone\x1b[0m\r\n');
  vm.sendInput(`python3 /root/lan-chat.py --nick ${vm.id}\n`);
  status(`${vm.id}: lan-chat started. Type to chat; /who lists peers, /msg NICK TEXT whispers, /quit leaves.`);
  t.focus();
}

$('add').onclick = addVM;
$('stopall').onclick = async () => {
  await mgr.destroyAll(); $('grid').replaceChildren(); updateLan(); status('All VMs removed.');
};
$('distro').addEventListener('change', () => { $('cfg').hidden = $('distro').value !== 'custom'; });

try {
  const distros = await loadDistros();
  const sel = $('distro');
  sel.querySelector('option[value=""]').remove();
  sel.prepend(...distros.map((d) => {
    const o = document.createElement('option');
    o.value = d.url; o.textContent = `${d.name} (${d.arch})`; o.title = d.description;
    return o;
  }));
  sel.selectedIndex = 0;
  $('cfg').hidden = sel.value !== 'custom';
  status(`${distros.length} distro(s) from TinyEMU-distros. ${ENGINE_NOTE} Add a VM to start.`);
} catch (e) {
  $('distro').querySelector('option[value=""]').textContent = 'no distro list';
  status(`No distro list (${e.message}): use a custom config URL.`);
}
updateLan();
</script>
</body>
</html>
