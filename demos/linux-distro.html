<!DOCTYPE html>

<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jsLab · Single VM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" integrity="sha384-nWN3KqaaVcbEsCjLSV+2jMjh62Iny/+mN3srM8TZeM8N6aj7eDl5wwYggjAJ4/sJ" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css" integrity="sha384-n2n7twoohnW+d3myBKaUgl7DSiwidw6MkQy9oesGzkPpMjejKRR3XlnD+5yCdtBD" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.js" integrity="sha384-f/1U6Z9wM4D71a5eRXEZnyOTMOvjqxr2XLwh+Go1OvIl3L3tOcvUrzudnhbECwl4" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/lib/addon-fit.js" integrity="sha384-txoiwu4RR2GD3qySbaj+BbzibkLbSJRcfqGYMu6z1EqHil4A2dyBiBW5dlacG6OR" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.12.0/lib/addon-web-links.js" integrity="sha384-0IIwkXq0LAkIxEVKxlOxWbje2g/VT+5CzVTZiEukyiZ02pOl/O+M0fkpEKAYqto9" crossorigin="anonymous"></script>
<style>
  #term { background: #0d1117; padding: 6px; }
  #term .xterm { height: 100%; }
</style>
</head>
<body class="d-flex flex-column vh-100 bg-body">
<nav class="navbar bg-1 border-bottom px-3 gap-2 flex-wrap">
  <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html"><i class="bi bi-terminal"></i> jsLab · Single VM</a>
  <select id="distro" class="form-control form-control-sm w-auto" aria-label="Distro" disabled>
    <option>Loading distros…</option>
  </select>
  <button id="boot" class="btn btn-sm btn-solid theme-primary" disabled><i class="bi bi-power"></i> <span>Boot</span></button>
  <span id="downloading" class="d-flex align-items-center gap-1 text-sm fg-3" hidden>
    <span class="spinner-border spinner-sm" aria-hidden="true"></span> downloading
  </span>
  <div class="d-flex align-items-center gap-2 ms-auto">
    <span id="ip" class="badge badge-subtle theme-secondary font-monospace" title="The guest's IPv4 address on the virtual LAN">no IP</span>
    <span id="state" class="badge theme-secondary">idle</span>
    <div class="btn-group" role="group" aria-label="Clipboard">
      <button id="copy" class="btn btn-sm btn-icon btn-subtle theme-secondary" title="Copy selection (Ctrl+Shift+C)" aria-label="Copy selection"><i class="bi bi-copy"></i></button>
      <button id="paste" class="btn btn-sm btn-icon btn-subtle theme-secondary" title="Paste (Ctrl+Shift+V)" aria-label="Paste"><i class="bi bi-clipboard"></i></button>
    </div>
  </div>
</nav>
<main class="flex-grow-1 p-2 min-h-0">
  <div id="term" class="h-100 rounded border overflow-hidden"></div>
</main>
<footer id="status" class="px-3 py-1 border-top bg-1 text-sm fg-3">Loading the distro list…</footer>

<script type="module">
// One VM in a Web Worker (lib/vm), its console in xterm.js (terminal.js), the
// distro list from _distro/manifest.json or TinyEMU-distros (distros.js).
import { VMManager } from '../lib/vm/index.js';
import { createTerminal } from './terminal.js';
import { loadDistros } from './distros.js';

const ROOT = new URL('../', location.href);   // jsLab's root: engine/, _distro/
const $ = (id) => document.getElementById(id);
const sel = $('distro'), bootBtn = $('boot'), statusEl = $('status');
const STATE_THEME = { starting: 'warning', running: 'success', paused: 'secondary', stopped: 'secondary', error: 'danger' };

const mgr = new VMManager({ network: { subnet: '10.0.2.0/24' } });
window.mgr = mgr;   // for console poking
let vm = null;

const t = createTerminal($('term'), { onData: (d) => vm?.sendInput(d) });
new ResizeObserver(() => t.fit()).observe($('term'));
$('copy').onclick = () => t.copy().then((ok) => { if (!ok) statusEl.textContent = 'Select some text in the console first.'; });
$('paste').onclick = () => t.paste();

function setState(s) {
  const el = $('state');
  el.textContent = s;
  el.className = `badge theme-${STATE_THEME[s] || 'secondary'}`;
}
function setIP(ip) {
  const el = $('ip');
  el.textContent = ip || 'no IP';
  el.className = `badge badge-subtle font-monospace theme-${ip ? 'info' : 'secondary'}`;
}

async function boot() {
  if (vm) { await mgr.destroy(vm.id); vm = null; }
  t.term.reset();
  setIP(null);
  const { cols, rows } = t.fit();
  const name = sel.selectedOptions[0].textContent;
  vm = await mgr.create('vm', { configUrl: sel.value, mode: 'worker', memoryMB: 256, hasNetwork: true, cols, rows });
  vm.onConsole((b) => t.write(b));
  vm.onState(setState);
  vm.onAddress(setIP);
  vm.on('downloading', (on) => { $('downloading').hidden = !on; });
  vm.onError((e) => { statusEl.textContent = `Error: ${e.message}`; });
  bootBtn.querySelector('span').textContent = 'Reboot';
  bootBtn.querySelector('i').className = 'bi bi-arrow-clockwise';
  statusEl.textContent = `Booting ${name}… (to a shell in about 20 s; for networking, run: udhcpc -i eth0)`;
  try { await vm.start(); statusEl.textContent = `${name} is running. Copy: Ctrl+Shift+C or right-click; paste: Ctrl+Shift+V or right-click.`; }
  catch (e) { statusEl.textContent = `Start failed: ${e.message}`; }
  t.focus();
}
bootBtn.onclick = boot;

try {
  const { source, distros } = await loadDistros(ROOT);
  sel.replaceChildren(...distros.map((d) => {
    const o = document.createElement('option');
    o.value = d.url; o.textContent = `${d.name} (${d.arch})`; o.title = d.description;
    return o;
  }));
  if (!distros.length) throw new Error('the list is empty');
  sel.disabled = false; bootBtn.disabled = false;
  statusEl.textContent = `${distros.length} distro(s)${source === 'published' ? ' from TinyEMU-distros' : ' staged in _distro/'}.`;
  boot();   // boot the first distro straight away
} catch (e) {
  sel.replaceChildren(new Option('no distros'));
  statusEl.textContent = `No distro list (${e.message}): stage one with TinyEMU-distros’ scripts/stage-web.sh.`;
}
</script>
</body>
</html>
